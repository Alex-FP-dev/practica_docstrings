site_name: Práctica de docstrings
site_description: Documentación generada automáticamente desde los docstrings

# Enlaces tipo "referencia.html" en vez de "referencia/": permite abrir
# la web directamente desde el explorador de archivos (file://)
use_directory_urls: false

theme:
  name: material
  language: es

# Vigila también el código para recargar al cambiar un docstring
watch:
  - .

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            members_order: source
            show_signature_annotations: true

# Permite dibujar diagramas Mermaid dentro de bloques ```mermaid
markdown_extensions:
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Inicio: index.md
  - Referencia: referencia.md
  - Diagramas: diagramas.md
